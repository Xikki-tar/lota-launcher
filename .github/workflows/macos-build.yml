name: macOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      MACOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable updates for dev builds
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          echo "LOTA_BUILD_DISABLE_UPDATES=1" >> "$GITHUB_ENV"
          printf 'UPDATES_DISABLED = True\n' > auth/build_api.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            for (const p of ['app/src-tauri/tauri.conf.json', 'app/package.json', 'updater/src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '$VERSION';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend with PyInstaller
        run: >
          pyinstaller backend.py
          --name backend
          --onefile
          --noconfirm
          --clean
          --exclude-module PySide6
          --add-data "${{ github.workspace }}/assets:assets"
          --distpath build/macos/dist
          --workpath build/macos/work
          --specpath build/macos

      - name: Place backend as Tauri sidecar
        run: |
          mkdir -p app/src-tauri/binaries
          target_triple="$(rustc -vV | sed -n 's/host: //p')"
          cp build/macos/dist/backend "app/src-tauri/binaries/backend-$target_triple"
          chmod +x "app/src-tauri/binaries/backend-$target_triple"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri app
        working-directory: app
        shell: bash
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            export APPLE_CERTIFICATE="$MACOS_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$MACOS_SIGNING_IDENTITY"
            if [ -n "$MACOS_NOTARY_APPLE_ID" ] && [ -n "$MACOS_NOTARY_PASSWORD" ] && [ -n "$MACOS_NOTARY_TEAM_ID" ]; then
              export APPLE_ID="$MACOS_NOTARY_APPLE_ID"
              export APPLE_PASSWORD="$MACOS_NOTARY_PASSWORD"
              export APPLE_TEAM_ID="$MACOS_NOTARY_TEAM_ID"
            fi
          fi
          npm run tauri build

      - name: Verify bundle signature
        run: |
          app_path="$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -iname '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo -archs "$app_path/Contents/MacOS/lota-launcher"
          lipo -archs "$app_path/Contents/MacOS/backend"

      - name: Zip the .app bundle
        run: |
          app_path="$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -iname '*.app' | head -1)"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "lota-launcher-macos-${{ matrix.arch }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lota-launcher-macos-${{ matrix.arch }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            lota-launcher-macos-${{ matrix.arch }}.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lota-launcher-macos-${{ matrix.arch }}.zip
